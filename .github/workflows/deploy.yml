name: CI/CD

on:
  push:
    branches: [main]      # push 到 main 自动构建并部署
  workflow_dispatch: {}   # 支持在 Actions 页面手动触发

env:
  APP_IMAGE: ghcr.io/letmesleep8h/myblog-app

jobs:
  build-push:
    name: 构建镜像并推送到 GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:latest
            ${{ env.APP_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 部署到服务器
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      # GHCR 包默认是私有的,服务器没有 ghcr 凭据,所以由 CI 拉取后直传
      - name: 从 GHCR 拉取镜像
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ${{ env.APP_IMAGE }}:${{ github.sha }}

      - name: 镜像传输到服务器
        run: |
          docker save ${{ env.APP_IMAGE }}:${{ github.sha }} | gzip | \
            ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            'gunzip | docker load && docker tag ${{ env.APP_IMAGE }}:${{ github.sha }} ${{ env.APP_IMAGE }}:latest'

      - name: 重启服务
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/Blog
            git fetch origin ${{ github.sha }}
            git checkout -f ${{ github.sha }}
            docker compose up -d --remove-orphans app
            docker image prune -f
            echo "=== 容器状态 ==="
            docker compose ps
