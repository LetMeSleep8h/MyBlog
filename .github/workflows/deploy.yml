name: CI/CD

on:
  push:
    branches: [main]      # push 到 main 自动构建并部署
  workflow_dispatch: {}   # 支持在 Actions 页面手动触发

# 同一条流水线同时只跑一个:新 push 自动取消还在跑的旧部署,避免互相踩
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_IMAGE: ghcr.io/letmesleep8h/myblog-app

jobs:
  build-push:
    name: 构建镜像并推送到 GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:latest
            ${{ env.APP_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 部署到服务器
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      # 镜像在 GHCR(私有),用 GITHUB_TOKEN 登录后取出来,只为拿到里面的 jar
      - name: 从镜像中取出 jar
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ${{ env.APP_IMAGE }}:${{ github.sha }}
          id=$(docker create ${{ env.APP_IMAGE }}:${{ github.sha }})
          docker cp $id:/app/app.jar ./app.jar
          docker rm $id
          ls -lh app.jar

      # 只跨境传 ~60MB 的 jar(而非几百 MB 镜像),断点续传 + 保活防止卡死
      - name: 传输构建产物
        run: |
          rsync -zz --partial --append-verify --timeout=180 \
            -e "ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=15" \
            app.jar Dockerfile.prod docker-compose.yml \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/Blog/

      # 基础镜像层服务器上已有,本地拼装只要几秒
      - name: 服务器拼镜像并重启
        run: |
          ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=15 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            'cd /opt/Blog \
             && docker build -f Dockerfile.prod -t blog-app:ci . \
             && docker compose up -d --remove-orphans app \
             && docker image prune -f \
             && echo "=== 容器状态 ===" \
             && docker compose ps'
