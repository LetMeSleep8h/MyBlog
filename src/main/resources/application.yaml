spring:
  application:
    name: Blog
  datasource:
    # 上线用 Docker 时通过环境变量 DB_URL / DB_USERNAME / DB_PASSWORD 注入,本地默认连本机
    url: ${DB_URL:jdbc:mysql://localhost:3306/blog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:12345678}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080

# 管理接口口令:默认 123456(本地开发用)
# 上线前在服务器环境变量里设 ADMIN_PASSWORD,会覆盖这个默认值
admin:
  password: ${ADMIN_PASSWORD:123456}